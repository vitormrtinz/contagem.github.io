<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Conferência Lafelli</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: uma coluna para celular; abas Coleta/Entrega fixas no topo, painel de avisos, cartões de item com contador grande */
:root{
  --bg:#eef0f2; --surface:#ffffff; --ink:#1b2128; --muted:#5d6872; --line:#d5dade;
  --hivis:#f2b400; --hivis-ink:#1b2128;
  --ok:#1f8a4c; --ok-bg:#e3f3e9; --warn:#b5560b; --warn-bg:#fbebdc; --bad:#c0262d; --bad-bg:#fbe4e4;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#14181c; --surface:#1e242a; --ink:#eef1f3; --muted:#9aa5ae; --line:#323b43;
  --hivis:#ffc61a; --hivis-ink:#14181c;
  --ok:#4cc884; --ok-bg:#163527; --warn:#f0a05a; --warn-bg:#3a2717; --bad:#ff7a7f; --bad-bg:#3d1c1e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14181c; --surface:#1e242a; --ink:#eef1f3; --muted:#9aa5ae; --line:#323b43;
  --hivis:#ffc61a; --hivis-ink:#14181c;
  --ok:#4cc884; --ok-bg:#163527; --warn:#f0a05a; --warn-bg:#3a2717; --bad:#ff7a7f; --bad-bg:#3d1c1e; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px;display:grid;gap:14px}
header{border-bottom:4px solid var(--hivis);padding-bottom:10px}
h1{font-family:var(--display);font-weight:700;font-size:1.9rem;line-height:1;margin:0;text-transform:uppercase;letter-spacing:.02em}
.sub{color:var(--muted);font-size:.85rem;margin-top:4px}
input{font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:10px;width:100%;min-width:0}
input:focus-visible,button:focus-visible{outline:3px solid var(--hivis);outline-offset:2px}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px;gap:4px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.tab{font-family:var(--display);font-size:1.25rem;text-transform:uppercase;letter-spacing:.05em;border:0;border-radius:7px;padding:10px;background:transparent;color:var(--muted);cursor:pointer;display:flex;justify-content:center;gap:8px;align-items:center}
.tab[aria-selected="true"]{background:var(--hivis);color:var(--hivis-ink)}
.badge{font-family:var(--body);font-size:.75rem;font-weight:600;border-radius:99px;padding:1px 8px;background:var(--bad);color:#fff}
.alert{border-radius:10px;padding:12px 14px;display:grid;gap:6px;border:1.5px solid var(--line);background:var(--surface)}
.alert h2{font-family:var(--display);font-size:1.15rem;text-transform:uppercase;letter-spacing:.05em;margin:0}
.alert ul{margin:0;padding-left:18px;display:grid;gap:3px}
.alert.bad{border-color:var(--bad);background:var(--bad-bg)} .alert.bad h2{color:var(--bad)}
.alert.ok{border-color:var(--ok);background:var(--ok-bg)} .alert.ok h2{color:var(--ok)}
.alert .hint{color:var(--muted);font-size:.9rem}
.item{background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:12px}
.top{display:grid;grid-template-columns:minmax(0,1fr) 84px;gap:12px;align-items:center}
.nfbox{display:grid;gap:3px}
.nfbox span{font-size:.68rem;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);text-align:center}
.item.ok{border-left-color:var(--ok)} .item.falta{border-left-color:var(--bad)} .item.sobra{border-left-color:var(--warn)}
.name{min-width:0;font-weight:700;font-size:1.55rem;line-height:1.1}
.st{display:inline-block;margin-top:4px;font-size:.75rem;font-weight:600;padding:1px 7px;border-radius:99px;background:var(--bg);color:var(--muted)}
.ok .st{background:var(--ok-bg);color:var(--ok)} .falta .st{background:var(--bad-bg);color:var(--bad)} .sobra .st{background:var(--warn-bg);color:var(--warn)}
.nf{text-align:center;padding:10px 4px;font-weight:600;font-variant-numeric:tabular-nums}
.cnt{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:8px}
.cnt.has-bulk{grid-template-columns:1fr 1.15fr 1fr 1fr}
.cnt button{border:0;border-radius:8px;background:var(--hivis);color:var(--hivis-ink);font-size:1.7rem;font-weight:700;min-height:54px;cursor:pointer;touch-action:manipulation}
.cnt button.m{background:var(--bg);color:var(--ink);border:1.5px solid var(--line)}
.cnt button.bulk{font-size:1.15rem;background:var(--ink);color:var(--bg)}
.cnt input{text-align:center;padding:10px 2px;font-size:1.25rem;font-weight:700;font-variant-numeric:tabular-nums}
.tot{display:flex;justify-content:space-between;font-family:var(--display);font-size:1.1rem;text-transform:uppercase;padding:0 12px;font-variant-numeric:tabular-nums}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{font:inherit;font-weight:600;padding:14px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.btn.pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.danger{color:var(--bad)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.95rem}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:10px}
#report{font-family:ui-monospace,Menlo,monospace;font-size:.82rem;min-height:200px;width:100%;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:8px;padding:10px}
.msg{font-size:.85rem;color:var(--ok);min-height:1.2em}
@media (prefers-reduced-motion:no-preference){.item{transition:border-color .15s}}
.hdr{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.gear{font:inherit;font-size:.85rem;font-weight:600;padding:8px 12px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;flex:none}
.panel h2{font-family:var(--display);font-size:1.15rem;text-transform:uppercase;letter-spacing:.05em;margin:0}
.fields{display:grid;grid-template-columns:1fr 1.4fr;gap:10px}
label.f{display:grid;gap:4px;font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.save{width:100%;font-size:1.1rem;padding:16px}
.status{font-size:.92rem;padding:10px 12px;border-radius:8px;background:var(--surface);border:1.5px solid var(--line)}
.status.ok{background:var(--ok-bg);color:var(--ok);border-color:var(--ok)}
.status.warn{background:var(--warn-bg);color:var(--warn);border-color:var(--warn)}
.status.bad{background:var(--bad-bg);color:var(--bad);border-color:var(--bad)}
.who{justify-self:start;display:flex;align-items:center;gap:7px;margin-top:-6px;padding:2px 0;border:0;background:none;font:inherit;font-size:.82rem;color:var(--muted);cursor:pointer;text-align:left}
.who::before{content:"";flex:none;width:8px;height:8px;border-radius:50%;background:var(--ok)}
.who.off{color:var(--warn);font-weight:600}
.who.off::before{background:var(--warn)}
.cfg-hint{font-size:.88rem;color:var(--muted)}
</style>
</head>
<body>


<div class="wrap">
  <header class="hdr">
    <div><h1>Conferência Lafelli</h1>
    <div class="sub">Digite a quantidade da nota e vá contando o material físico.</div></div>
    <button class="gear" id="btnCfg" type="button" aria-expanded="false">Configurar</button>
  </header>
  <button class="who" id="who" type="button"></button>

  <section class="panel" id="cfg" hidden>
    <h2>Ligação com a planilha</h2>
    <label class="f">Endereço do Apps Script<input id="cfgUrl" placeholder="https://script.google.com/macros/s/.../exec" autocomplete="off"></label>
    <label class="f">Senha<input id="cfgToken" type="password" autocomplete="off"></label>
    <label class="f">Seu nome (conferente)<input id="cfgNome" autocomplete="name"></label>
    <div class="actions"><button class="btn pri" id="cfgSalvar" type="button">Salvar e testar</button><button class="btn" id="cfgFechar" type="button">Fechar</button></div>
    <div class="cfg-hint" id="cfgMsg">Esses dados ficam guardados só neste aparelho.</div>
  </section>

  <section class="panel">
    <div class="fields">
      <label class="f">Data<input id="fData" type="date"></label>
      <label class="f">Cliente<input id="fCliente" list="listaClientes" placeholder="Escolha ou digite" autocomplete="off"></label>
    </div>
    <datalist id="listaClientes"></datalist>
  </section>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="coleta" aria-selected="true">Coleta <span class="badge" id="b-coleta" hidden></span></button>
    <button class="tab" role="tab" data-tab="entrega" aria-selected="false">Entrega <span class="badge" id="b-entrega" hidden></span></button>
  </div>

  <div class="alert" id="alert" aria-live="polite"></div>

  <div id="list" style="display:grid;gap:8px"></div>

  <button class="btn pri save" id="salvar" type="button">Salvar na planilha</button>
  <div class="status" id="status" hidden aria-live="polite"></div>
  <div class="actions">
    <button class="btn" id="gerar" type="button">Gerar resumo</button>
    <button class="btn danger" id="limpar" type="button">Nova conferência</button>
  </div>
  <div class="confirm" id="confirmBox" hidden><span id="confirmTxt"></span>
    <button class="btn danger" id="simLimpar" type="button">Sim, apagar</button>
    <button class="btn" id="naoLimpar" type="button">Cancelar</button>
  </div>

  <section class="panel" id="repBox" hidden>
    <textarea id="report" readonly aria-label="Resumo da conferência"></textarea>
    <button class="btn pri" id="copiar" type="button">Copiar resumo</button>
    <div class="msg" id="msg"></div>
  </section>
</div>

<script>
const ITENS=["Avental com manga","Avental sem manga","Avental cintura","Blusão de vaqueta","Perneira","Luva Kevlar","Luva raspa marrom","Luva mista"];
const KEY="lafelli-conf-v2";
// Botão de soma rápida por aba (índice segue ITENS; 0 = sem botão)
const BULK={coleta:[10,10,10,10,10,10,10,10],entrega:[5,5,5,4,0,10,10,10]};
const blank=()=>({id:novoId(),data:hoje(),cliente:"",rev:0,salvo:false,jaEnviado:false,tab:"coleta",coleta:ITENS.map(()=>({nf:"",c:0})),entrega:ITENS.map(()=>({nf:"",c:0}))});
let S;
try{S=JSON.parse(localStorage.getItem(KEY))||blank()}catch(e){S=blank()}
if(!S.coleta||S.coleta.length!==ITENS.length)S=blank();
if(!S.id)S.id=novoId();if(!S.data)S.data=hoje();if(S.cliente==null)S.cliente="";
function novoId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function hoje(){const d=new Date(),z=n=>String(n).padStart(2,"0");return`${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}`}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const $=id=>document.getElementById(id);
const pc=n=>n===1?"peça":"peças";

function status(r){
  if(r.nf==="")return r.c>0?["","Falta a qtd. da nota"]:["","Aguardando"];
  const n=+r.nf;
  if(r.c===n)return["ok","Confere"];
  return r.c<n?["falta",`Faltam ${n-r.c} ${pc(n-r.c)}`]:["sobra",`Sobram ${r.c-n} ${pc(r.c-n)}`];
}
const isDiv=r=>{const s=status(r)[0];return s==="falta"||s==="sobra"};

function renderAlert(){
  const rows=S[S.tab],A=$("alert"),nome=S.tab==="coleta"?"coleta":"entrega";
  const used=rows.map((r,i)=>[r,i]).filter(([r])=>r.nf!=="");
  const d=used.filter(([r])=>isDiv(r));
  if(!used.length){A.className="alert";A.innerHTML=`<h2>Comece pela nota</h2><div class="hint">Digite no campo "Nota" a quantidade de cada item da ${nome}. Depois conte com os botões + e −.</div>`;return}
  if(d.length){
    A.className="alert bad";
    A.innerHTML=`<h2>${d.length} ${d.length===1?"item não bate":"itens não batem"}</h2><ul>${d.map(([r,i])=>`<li><b>${ITENS[i]}</b>: ${status(r)[1].toLowerCase()}</li>`).join("")}</ul>`;
  }else{
    A.className="alert ok";
    A.innerHTML=`<h2>Tudo confere</h2><div class="hint">Os ${used.length} itens da nota batem com a contagem.</div>`;
  }
}
function renderBadges(){["coleta","entrega"].forEach(t=>{const n=S[t].filter(isDiv).length,b=$("b-"+t);b.hidden=!n;b.textContent=n})}
function totals(){const rows=S[S.tab];return[rows.reduce((a,r)=>a+(+r.nf||0),0),rows.reduce((a,r)=>a+r.c,0)]}

function renderList(){
  const rows=S[S.tab];
  let h="";
  rows.forEach((r,i)=>{const[s,t]=status(r),bk=BULK[S.tab][i];
    h+=`<div class="item ${s}" id="it${i}"><div class="top"><div class="name">${ITENS[i]}<br><span class="st">${t}</span></div>
    <label class="nfbox"><span>Nota</span><input class="nf" id="nf-${S.tab}-${i}" inputmode="numeric" aria-label="Quantidade na nota: ${ITENS[i]}" value="${r.nf}" data-i="${i}" placeholder="0"></label></div>
    <div class="cnt${bk?" has-bulk":""}"><button class="m" data-i="${i}" data-d="-1" aria-label="Menos um">−</button>
    <input id="c-${S.tab}-${i}" inputmode="numeric" aria-label="Quantidade contada: ${ITENS[i]}" value="${r.c}" data-i="${i}">
    <button data-i="${i}" data-d="1" aria-label="Mais um">+</button>${bk?`<button class="bulk" data-i="${i}" data-d="${bk}" aria-label="Mais ${bk}">+${bk}</button>`:""}</div></div>`});
  const[tn,tc]=totals();
  h+=`<div class="tot" id="tot"><span>Total nota: ${tn}</span><span>Contado: ${tc}</span></div>`;
  $("list").innerHTML=h;renderAlert();renderBadges();
}
function refreshItem(i){
  const r=S[S.tab][i],el=$("it"+i),[s,t]=status(r);
  el.className="item "+s;el.querySelector(".st").textContent=t;
  const[tn,tc]=totals();$("tot").innerHTML=`<span>Total nota: ${tn}</span><span>Contado: ${tc}</span>`;
  renderAlert();renderBadges();touch();
}
$("list").addEventListener("click",e=>{const b=e.target.closest("button[data-d]");if(!b)return;
  const i=+b.dataset.i,r=S[S.tab][i];r.c=Math.max(0,r.c+ +b.dataset.d);
  $(`c-${S.tab}-${i}`).value=r.c;refreshItem(i)});
$("list").addEventListener("input",e=>{const el=e.target;if(el.tagName!=="INPUT")return;
  const i=+el.dataset.i,r=S[S.tab][i],v=el.value.replace(/\D/g,"");el.value=v;
  if(el.classList.contains("nf"))r.nf=v;else r.c=+v||0;refreshItem(i)});

function setTab(t){S.tab=t;document.querySelectorAll(".tab").forEach(x=>x.setAttribute("aria-selected",x.dataset.tab===t));save();renderList()}
document.querySelectorAll(".tab").forEach(t=>t.addEventListener("click",()=>setTab(t.dataset.tab)));

function report(){
  const d=S.data?S.data.split("-").reverse().join("/"):"";
  let o=`CONFERÊNCIA LAFELLI EPI'S — ${d}\nCliente: ${S.cliente||"-"}\n`;
  [["coleta","COLETA"],["entrega","ENTREGA"]].forEach(([k,n])=>{
    const rows=S[k];if(!rows.some(r=>r.nf!==""||r.c>0))return;
    o+=`\n${n}\n`;
    rows.forEach((r,i)=>{if(r.nf===""&&r.c===0)return;
      o+=`• ${ITENS[i]}: nota ${r.nf===""?"-":r.nf} / contado ${r.c} → ${status(r)[1]}\n`});
    o+=`Total: nota ${rows.reduce((a,r)=>a+(+r.nf||0),0)} / contado ${rows.reduce((a,r)=>a+r.c,0)}\n`;
  });
  return o;
}
$("gerar").addEventListener("click",()=>{$("report").value=report();$("repBox").hidden=false;$("msg").textContent="";$("repBox").scrollIntoView({behavior:"smooth"})});
$("copiar").addEventListener("click",()=>{const t=$("report");
  const fb=()=>{t.focus();t.select();$("msg").textContent="Texto selecionado. Use Copiar do seu celular."};
  try{navigator.clipboard.writeText(t.value).then(()=>$("msg").textContent="Copiado. Cole no WhatsApp ou e-mail.",fb)}catch(e){fb()}});
$("limpar").addEventListener("click",()=>{$("confirmTxt").textContent=(!S.salvo&&temDados())?"Esta conferência ainda não foi salva na planilha. Apagar mesmo assim?":"Apagar coleta e entrega e começar do zero?";$("confirmBox").hidden=false});
$("naoLimpar").addEventListener("click",()=>$("confirmBox").hidden=true);
$("simLimpar").addEventListener("click",()=>{S=blank();save();$("fData").value=S.data;$("fCliente").value="";$("confirmBox").hidden=true;$("repBox").hidden=true;aviso("");btnSalvar();setTab("coleta")});

// ===== Ligação com a planilha (Google Sheets via Apps Script) =====
const CFGKEY="lafelli-config",FILAKEY="lafelli-fila",CLIKEY="lafelli-clientes";
const ler=(k,f)=>{try{const v=JSON.parse(localStorage.getItem(k));return v??f}catch(e){return f}};
const gravar=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const esc=x=>String(x).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let CFG=ler(CFGKEY,{url:"",token:"",nome:""});
const configurado=()=>!!(CFG.url&&CFG.token);
function renderWho(){const w=$("who");if(configurado()){w.className="who";w.textContent="Conectado como "+(CFG.nome||"(sem nome)")}else{w.className="who off";w.textContent="Não conectado à planilha. Toque para configurar."}}
const temDados=()=>["coleta","entrega"].some(k=>S[k].some(r=>r.nf!==""||r.c>0));

function touch(){S.salvo=false;S.rev=(S.rev||0)+1;save();btnSalvar()}
function btnSalvar(){$("salvar").textContent=S.salvo?"Salvo na planilha ✓":(S.jaEnviado?"Atualizar na planilha":"Salvar na planilha")}
function aviso(msg,kind){const el=$("status");el.hidden=!msg;el.className="status"+(kind?" "+kind:"");el.textContent=msg||""}

$("fData").value=S.data;$("fCliente").value=S.cliente||"";
$("fData").addEventListener("input",e=>{S.data=e.target.value;touch()});
$("fCliente").addEventListener("input",e=>{S.cliente=e.target.value;touch()});

function preencherClientes(l){$("listaClientes").innerHTML=(l||[]).map(c=>`<option value="${esc(c)}"></option>`).join("")}
preencherClientes(ler(CLIKEY,[]));
async function carregarClientes(){
  const r=await fetch(CFG.url+"?acao=clientes&token="+encodeURIComponent(CFG.token));
  const j=await r.json();if(!j.ok)throw new Error(j.erro||"erro desconhecido");
  gravar(CLIKEY,j.clientes);preencherClientes(j.clientes);return j.clientes.length;
}

function montarEnvio(){
  const linhas=[];
  [["coleta","Coleta"],["entrega","Entrega"]].forEach(([k,n])=>S[k].forEach((r,i)=>{
    if(r.nf===""&&r.c===0)return;
    linhas.push({tipo:n,item:ITENS[i],nota:r.nf===""?"":+r.nf,contado:r.c,diferenca:r.nf===""?"":r.c-(+r.nf),situacao:status(r)[1]});
  }));
  return{id:S.id,rev:S.rev||0,data:S.data,cliente:S.cliente.trim(),conferente:CFG.nome||"",linhas};
}

let enviando=false;
async function enviarFila(){
  if(enviando||!configurado())return;
  let fila=ler(FILAKEY,[]);if(!fila.length)return;
  enviando=true;
  try{
    while(fila.length){
      const p=fila[0];let j;
      try{
        const r=await fetch(CFG.url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({...p,token:CFG.token})});
        j=await r.json();
      }catch(e){aviso(`Sem conexão com a planilha. ${fila.length===1?"1 conferência guardada":fila.length+" conferências guardadas"} neste aparelho. O envio acontece sozinho quando a internet voltar.`,"warn");return}
      if(!j.ok){aviso(`A planilha recusou o envio: ${j.erro||"erro desconhecido"}. Confira em Configurar.`,"bad");return}
      fila.shift();gravar(FILAKEY,fila);
      if(p.id===S.id&&p.rev===(S.rev||0)){S.salvo=true;S.jaEnviado=true;save();btnSalvar()}
      else if(p.id===S.id){S.jaEnviado=true;save();btnSalvar()}
    }
    aviso(`Salvo na planilha às ${new Date().toTimeString().slice(0,5)}.`,"ok");
  }finally{enviando=false}
}

$("salvar").addEventListener("click",()=>{
  if(!configurado()){abrirCfg();aviso("Primeiro ligue o app à planilha: preencha o endereço e a senha em Configurar.","warn");return}
  if(!S.cliente.trim()){aviso("Escolha o cliente antes de salvar.","bad");$("fCliente").focus();return}
  if(!S.data){aviso("Preencha a data antes de salvar.","bad");return}
  const p=montarEnvio();if(!p.linhas.length){aviso("Nenhum item preenchido ainda.","bad");return}
  const fila=ler(FILAKEY,[]).filter(x=>x.id!==p.id);fila.push(p);gravar(FILAKEY,fila);
  aviso("Enviando para a planilha…","");enviarFila();
});

function abrirCfg(){$("cfg").hidden=false;$("btnCfg").setAttribute("aria-expanded","true");$("cfgUrl").value=CFG.url;$("cfgToken").value=CFG.token;$("cfgNome").value=CFG.nome;$("cfg").scrollIntoView({behavior:"smooth"})}
function fecharCfg(){$("cfg").hidden=true;$("btnCfg").setAttribute("aria-expanded","false")}
$("btnCfg").addEventListener("click",()=>$("cfg").hidden?abrirCfg():fecharCfg());
$("cfgFechar").addEventListener("click",fecharCfg);
$("cfgSalvar").addEventListener("click",async()=>{
  CFG={url:$("cfgUrl").value.trim(),token:$("cfgToken").value.trim(),nome:$("cfgNome").value.trim()};gravar(CFGKEY,CFG);renderWho();
  if(!/^https:\/\/script\.google\.com\/.+\/exec$/.test(CFG.url)){$("cfgMsg").textContent="O endereço precisa começar com https://script.google.com/ e terminar em /exec.";return}
  if(!CFG.token){$("cfgMsg").textContent="Digite a senha definida no código da planilha.";return}
  $("cfgMsg").textContent="Testando a ligação…";
  try{const n=await carregarClientes();$("cfgMsg").textContent=`Ligado à planilha. ${n} cliente(s) carregado(s).`;enviarFila()}
  catch(e){$("cfgMsg").textContent=`Não consegui falar com a planilha: ${e.message||"sem conexão"}.`}
});

$("who").addEventListener("click",abrirCfg);renderWho();
window.addEventListener("online",enviarFila);
btnSalvar();
{const n=ler(FILAKEY,[]).length;if(n)aviso(`${n} conferência(s) aguardando envio para a planilha.`,"warn")}
enviarFila();if(configurado())carregarClientes().catch(()=>{});

setTab(S.tab);
</script>
